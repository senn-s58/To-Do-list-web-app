<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="theme-menu">
            <button class="theme-toggle" id="theme-toggle" type="button" aria-expanded="false" aria-controls="theme-panel">Tema</button>
            <div class="theme-panel" id="theme-panel" hidden>
                <h3>Ganti Tema</h3>
                <div class="theme-options" aria-label="Pilihan tema">
                    <button class="theme-option red" type="button" data-theme="red" aria-label="Tema merah"></button>
                    <button class="theme-option green" type="button" data-theme="green" aria-label="Tema hijau"></button>
                    <button class="theme-option yellow" type="button" data-theme="yellow" aria-label="Tema kuning"></button>
                    <button class="theme-option pink" type="button" data-theme="pink" aria-label="Tema pink"></button>
                    <button class="theme-option cyan" type="button" data-theme="cyan" aria-label="Tema cyan"></button>
                    <button class="theme-option blue" type="button" data-theme="blue" aria-label="Tema biru"></button>
                    <button class="theme-option purple" type="button" data-theme="purple" aria-label="Tema purple"></button>
                    <button class="theme-option orange" type="button" data-theme="orange" aria-label="Tema orange"></button>
                    <button class="theme-option magenta" type="button" data-theme="magenta" aria-label="Tema magenta"></button>
                </div>
            </div>
        </div>
        <div class="intro">
            <h1>To-Do List</h1>
            <h2>Catat Semua Tugasmu</h2>
            <p>Catat tugas sekolah, kegiatan, dan kebutuhanmu agar tidak ada yang terlupakan.</p>
        </div>
        <div class="todo-app">
            <div class="row">
                <input type="text" id="input-box" placeholder="Tambahkan List">
                <button onclick="addTask()">Tambah</button>
            </div>
             <ul id="list-container">
                    <!-- <li class="checked">Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li> -->
            </ul>
        </div>
    </div>
  <script src="script.js"></script>
</body>
</html>
